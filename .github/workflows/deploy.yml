name: Build and Deploy to Namecheap

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          cd app
          npm install

      - name: Build Project
        run: |
          cd app
          npm run build

      - name: Deploy via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.6
        with:
          username: ${{ secrets.SFTP_USERNAME }}
          server: 'spacei.westley-group.com'
          password: ${{ secrets.SFTP_PASSWORD }}
          port: 21098
          local_path: './app/dist/*'
          remote_path: '/public_html/spacei'
          sftp_only: true
